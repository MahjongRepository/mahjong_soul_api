[project]
name = "ms_api"
version = "0.11.252"
description = "Python wrapper for the Mahjong Soul (Majsoul) Protobuf objects. It allows to use their API."
readme = "README.md"
authors = [{ name = "Nihisil", email = "alexey@nihisil.com" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "protobuf>=5.29",
    "websockets>=15.0.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
]

[project.urls]
Homepage = "https://github.com/MahjongRepository/mahjong_soul_api"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ms"]

[dependency-groups]
dev = [
    "aiohttp>=3.13",
]
